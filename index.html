<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>League Hub — Unprofessional Redraft &amp; Never Ending Dynasty</title>
<meta name="theme-color" content="#0D1B22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --deep-teal:#1A6684; --mid-teal:#4BA5B8; --light-teal:#90BCC0; --magenta:#AB3B80; --magenta-b:#D970B5;
  --ink:#0D1B22; --ink2:#122330; --ink3:#1A3040;
  --glass:rgba(255,255,255,0.05); --glass-border:rgba(255,255,255,0.1); --glass-hover:rgba(255,255,255,0.08);
  --text-primary:rgba(255,255,255,0.95); --text-secondary:rgba(255,255,255,0.6); --text-muted:rgba(255,255,255,0.36);
  --accent:#4BA5B8; --accent-bright:#6EC8D8; --good:#6EC8D8; --bad:#E8806B; --gold:#E8C468;
}
html { scroll-behavior:smooth; scroll-padding-top:env(safe-area-inset-top,0px); }
:root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
.safe-top { position:fixed; top:0; left:0; right:0; height:env(safe-area-inset-top,0px); background:rgba(13,27,34,0.96); z-index:200; }
body { font-family:"DM Sans",sans-serif; background:var(--ink); color:var(--text-primary); min-height:100vh; overflow-x:hidden; -webkit-text-size-adjust:100%; }
body::before { content:""; position:fixed; inset:0; background:
  radial-gradient(ellipse 80% 60% at 50% -10%, rgba(26,102,132,0.28) 0%, transparent 70%),
  radial-gradient(ellipse 40% 40% at 90% 80%, rgba(171,59,128,0.10) 0%, transparent 60%),
  radial-gradient(ellipse 50% 50% at 10% 90%, rgba(75,165,184,0.07) 0%, transparent 60%); pointer-events:none; z-index:0; }
.app, header, .tab-bar { position:relative; z-index:1; }
button, select, input { font-family:inherit; }

/* header */
header { padding:14px 40px; display:flex; align-items:center; gap:18px; border-bottom:1px solid var(--glass-border); backdrop-filter:blur(12px); background:rgba(13,27,34,0.82); position:sticky; top:env(safe-area-inset-top,0px); z-index:100; }
.header-mark { flex-shrink:0; display:flex; }
.header-divider { width:1px; height:32px; background:var(--glass-border); flex-shrink:0; }
.header-wordmark { display:flex; flex-direction:column; gap:2px; min-width:0; }
.header-title { font-size:14px; font-weight:600; letter-spacing:-0.01em; white-space:nowrap; }
.header-sub { font-size:11px; color:var(--text-muted); white-space:nowrap; }
.header-pills { display:flex; gap:8px; margin-left:auto; align-items:center; }
.header-pill { padding:4px 13px; border-radius:20px; border:1px solid var(--glass-border); background:var(--glass); font-size:11px; font-weight:500; color:var(--text-secondary); white-space:nowrap; }
.header-pill span { color:var(--accent-bright); font-weight:700; margin-right:4px; }
.me-pick { display:flex; align-items:center; gap:8px; padding:3px 4px 3px 12px; border-radius:20px; border:1px solid rgba(171,59,128,0.4); background:rgba(171,59,128,0.12); font-size:11px; font-weight:600; color:var(--magenta-b); white-space:nowrap; }
.me-pick select { background:rgba(0,0,0,0.3); border:1px solid rgba(171,59,128,0.35); color:#fff; border-radius:16px; padding:4px 10px; font-size:11px; font-weight:600; outline:none; cursor:pointer; }
.me-pick select option { background:var(--ink2); color:var(--text-primary); }

/* tabs */
.tab-bar { display:flex; padding:0 40px; border-bottom:1px solid var(--glass-border); background:rgba(13,27,34,0.62); backdrop-filter:blur(8px); position:sticky; top:calc(env(safe-area-inset-top,0px) + 63px); z-index:90; overflow-x:auto; scrollbar-width:none; }
.tab-bar::-webkit-scrollbar { display:none; }
.tab-btn { padding:13px 18px 11px; font-size:11px; font-weight:600; color:var(--text-muted); background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; transition:all .2s; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
.tab-btn:hover { color:var(--text-secondary); }
.tab-btn.active { color:var(--accent-bright); border-bottom-color:var(--accent-bright); }
.tab-panel { display:none; } .tab-panel.active { display:block; }

.wrap { padding:48px 40px 90px; max-width:1360px; margin:0 auto; }
.hero { margin-bottom:34px; display:flex; align-items:flex-end; justify-content:space-between; gap:40px; }
.eyebrow { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.18em; color:var(--accent); margin-bottom:14px; display:flex; align-items:center; gap:10px; }
.eyebrow::before { content:""; display:inline-block; width:20px; height:1px; background:var(--accent); }
.eyebrow.mag { color:var(--magenta-b); } .eyebrow.mag::before { background:var(--magenta-b); }
.headline { font-family:"DM Serif Display",serif; font-size:50px; font-weight:400; line-height:1.07; letter-spacing:-0.02em; }
.headline em { font-style:italic; color:var(--accent-bright); }
.hero-desc { max-width:340px; flex-shrink:0; font-size:13.5px; color:var(--text-secondary); line-height:1.7; border-left:2px solid rgba(75,165,184,0.3); padding-left:16px; }
.hero-desc.mag { border-left-color:rgba(171,59,128,0.4); }

.sec { margin-top:34px; }
.sec-head { display:flex; align-items:baseline; gap:12px; margin-bottom:6px; flex-wrap:wrap; }
.sec-title { font-family:"DM Serif Display",serif; font-size:23px; letter-spacing:-0.01em; }
.sec-title em { font-style:italic; color:var(--accent-bright); }
.sec-sub { font-size:12.5px; color:var(--text-secondary); line-height:1.6; max-width:760px; margin-bottom:14px; }
.takeaway { font-size:13px; color:var(--text-primary); line-height:1.6; padding:10px 14px; border-radius:9px; background:rgba(75,165,184,0.1); border:1px solid rgba(75,165,184,0.25); margin-bottom:14px; }
.takeaway b { color:var(--accent-bright); font-weight:600; }

/* cards */
.card { position:relative; border-radius:14px; border:1px solid var(--glass-border); background:var(--glass); backdrop-filter:blur(16px); padding:20px 20px 16px; overflow:hidden; }
.card.click { cursor:pointer; transition:all .22s ease; }
.card.click::before { content:""; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,rgba(75,165,184,0.7) 50%,transparent); opacity:0; transition:opacity .22s; }
.card.click:hover::before, .card.click.active::before { opacity:1; }
.card.click:hover { background:var(--glass-hover); transform:translateY(-2px); box-shadow:0 10px 36px rgba(0,0,0,0.4), 0 0 0 1px rgba(75,165,184,0.2); }
.card.click.active { background:rgba(171,59,128,0.12); border-color:rgba(171,59,128,0.45); }
.card.mag::before { background:linear-gradient(90deg,transparent,rgba(171,59,128,0.7) 50%,transparent); }
.card-num { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.15em; color:var(--accent); margin-bottom:8px; }
.card-name { font-size:15px; font-weight:600; line-height:1.28; margin-bottom:6px; }
.card-desc { font-size:12px; color:var(--text-secondary); line-height:1.6; }
.card-foot { margin-top:12px; padding-top:10px; border-top:1px solid var(--glass-border); font-size:10.5px; color:var(--text-muted); display:flex; justify-content:space-between; gap:8px; }
.card-foot b { color:var(--accent); font-weight:600; }
.grid { display:grid; gap:12px; }
.g2 { grid-template-columns:repeat(2,1fr); } .g3 { grid-template-columns:repeat(3,1fr); } .g4 { grid-template-columns:repeat(4,1fr); } .g5 { grid-template-columns:repeat(5,1fr); }
.g-auto { grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

.avatar { width:44px; height:44px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:#fff; background:rgba(75,165,184,0.18); border:1.5px solid rgba(75,165,184,0.45); position:relative; }
.avatar::after { content:""; position:absolute; inset:3px; border-radius:50%; border:1px solid rgba(75,165,184,0.3); }
.avatar.me { background:rgba(171,59,128,0.22); border-color:rgba(171,59,128,0.6); } .avatar.me::after { border-color:rgba(171,59,128,0.4); }
.avatar.lg { width:64px; height:64px; font-size:20px; }
.person { display:flex; align-items:center; gap:12px; }
.person-name { font-size:14px; font-weight:600; } .person-sub { font-size:10.5px; color:var(--text-muted); margin-top:2px; }
.me-tag { color:var(--magenta-b); }

/* toggles & pills */
.seg { display:flex; gap:6px; margin-bottom:18px; padding:4px; background:rgba(0,0,0,0.18); border:1px solid var(--glass-border); border-radius:12px; width:fit-content; max-width:100%; overflow-x:auto; scrollbar-width:none; }
.seg::-webkit-scrollbar { display:none; }
.seg-btn { padding:8px 16px; border-radius:9px; border:none; background:transparent; color:var(--text-muted); font-size:12px; font-weight:600; cursor:pointer; transition:all .16s; white-space:nowrap; }
.seg-btn:hover { color:var(--text-secondary); }
.seg-btn.active { background:rgba(75,165,184,0.16); color:var(--accent-bright); box-shadow:inset 0 0 0 1px rgba(75,165,184,0.35); }
.filters { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:16px; }
.f-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--text-muted); margin-right:2px; }
.f-btn { padding:4px 13px; border-radius:20px; border:1px solid var(--glass-border); background:transparent; color:var(--text-secondary); font-size:11px; font-weight:500; cursor:pointer; transition:all .15s; }
.f-btn:hover { border-color:var(--accent); color:var(--accent-bright); }
.f-btn.active { background:rgba(75,165,184,0.15); border-color:rgba(75,165,184,0.5); color:var(--accent-bright); }
.f-btn.mag.active { background:rgba(171,59,128,0.16); border-color:rgba(171,59,128,0.5); color:var(--magenta-b); }
.sel { background:rgba(0,0,0,0.25); border:1px solid var(--glass-border); border-radius:8px; padding:7px 10px; font-size:12px; color:var(--text-secondary); outline:none; cursor:pointer; }
.sel:focus { border-color:rgba(75,165,184,0.5); } .sel option { background:var(--ink2); color:var(--text-primary); }

/* stat tiles */
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:8px; }
.tile { border-radius:10px; padding:11px 12px; background:var(--glass); border:1px solid var(--glass-border); }
.tile .v { font-size:21px; font-weight:700; letter-spacing:-0.01em; }
.tile .l { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); margin-top:3px; }
.tile .s { font-size:10.5px; color:var(--text-secondary); margin-top:3px; }
.tile.hl { background:rgba(171,59,128,0.14); border-color:rgba(171,59,128,0.4); }
.tile.teal { background:rgba(75,165,184,0.12); border-color:rgba(75,165,184,0.3); }

.badge { font-size:9.5px; font-weight:700; letter-spacing:.03em; padding:2px 8px; border-radius:6px; text-transform:uppercase; white-space:nowrap; }
.b-teal { background:rgba(75,165,184,0.18); color:var(--accent-bright); } .b-mag { background:rgba(171,59,128,0.22); color:var(--magenta-b); }
.b-good { background:rgba(112,173,71,0.18); color:#92D492; } .b-bad { background:rgba(232,128,107,0.18); color:var(--bad); } .b-gold { background:rgba(232,196,104,0.18); color:var(--gold); } .b-mute { background:rgba(255,255,255,0.07); color:var(--text-muted); }

/* tables */
.tbl { width:100%; border-collapse:collapse; font-size:12px; }
.tbl th { text-align:left; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); padding:7px 8px; border-bottom:1px solid var(--glass-border); white-space:nowrap; }
.tbl td { padding:8px; border-bottom:1px solid rgba(255,255,255,0.06); color:var(--text-secondary); vertical-align:middle; }
.tbl tr:last-child td { border-bottom:none; } .tbl tr:hover td { background:rgba(255,255,255,0.03); }
.tbl td.n { color:var(--text-primary); font-weight:600; } .tbl tr.me td { background:rgba(171,59,128,0.1); } .tbl tr.me td.n { color:var(--magenta-b); }
.tbl .r { text-align:right; } .tbl .c { text-align:center; }
.scroll-x { overflow-x:auto; }

/* bars */
.brow { display:flex; align-items:center; gap:10px; margin:3px 0; }
.bname { width:64px; font-size:12.5px; font-weight:500; color:var(--text-primary); flex-shrink:0; } .bname.me { color:var(--magenta-b); font-weight:700; }
.btrack { position:relative; flex:1; height:20px; }
.bval { width:78px; font-size:11.5px; color:var(--text-secondary); text-align:right; flex-shrink:0; }
.axis { display:flex; gap:10px; font-size:10px; color:var(--text-muted); margin-top:3px; }
.axis > div:nth-child(2) { flex:1; display:flex; justify-content:space-between; }
.dot { position:absolute; width:10px; height:10px; border-radius:50%; top:5px; }
.dot.hollow { border:2px solid #9aa9b0; background:var(--ink); box-sizing:border-box; }
.line { position:absolute; top:9px; height:4px; border-radius:2px; }
.zero { position:absolute; left:50%; top:0; bottom:0; border-left:1px solid rgba(255,255,255,0.18); }
.legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin:0 0 10px; font-size:11px; color:var(--text-secondary); }
.legend span { display:flex; align-items:center; gap:5px; }
.sw { width:11px; height:11px; border-radius:3px; display:inline-block; }

/* heat + barcode */
.hgrid { display:grid; gap:3px; align-items:center; }
.hcell { height:30px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:11.5px; border:1px solid rgba(255,255,255,0.06); }
.hlab { font-size:12px; color:var(--text-primary); } .hlab.me { color:var(--magenta-b); font-weight:700; }
.hhead { font-size:10.5px; color:var(--text-muted); text-align:center; }

/* howto */
details.howto { margin-top:12px; border:1px solid var(--glass-border); border-radius:10px; background:rgba(0,0,0,0.15); }
details.howto summary { cursor:pointer; padding:9px 14px; font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--accent); list-style:none; display:flex; align-items:center; gap:8px; }
details.howto summary::-webkit-details-marker { display:none; }
details.howto summary::before { content:"?"; width:16px; height:16px; border-radius:50%; border:1px solid rgba(75,165,184,0.5); display:inline-flex; align-items:center; justify-content:center; font-size:10px; }
details.howto[open] summary { color:var(--accent-bright); border-bottom:1px solid var(--glass-border); }
details.howto .hbody { padding:12px 14px; font-size:12px; color:var(--text-secondary); line-height:1.7; }
details.howto .hbody p { margin-bottom:8px; } details.howto .hbody b { color:var(--text-primary); font-weight:600; }
.note { font-size:11px; color:var(--text-muted); font-style:italic; margin-top:10px; line-height:1.6; }
.callout { padding:14px 16px; border-radius:11px; border:1px solid rgba(171,59,128,0.35); background:rgba(171,59,128,0.1); font-size:12.5px; color:var(--text-secondary); line-height:1.7; }
.callout b { color:var(--magenta-b); }
.empty { padding:40px 20px; text-align:center; color:var(--text-muted); font-size:13px; }
.divider { height:1px; background:var(--glass-border); margin:30px 0; }

/* grades */
.grades { display:grid; grid-template-columns:repeat(auto-fit,minmax(86px,1fr)); gap:8px; }
.grade { border-radius:10px; padding:10px 6px; text-align:center; border:1px solid var(--glass-border); }
.grade .gl { font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; opacity:.85; }
.grade .gv { font-family:"DM Serif Display",serif; font-size:30px; line-height:1.15; }
.grade .gr { font-size:10px; opacity:.8; }
.gA { background:rgba(75,165,184,0.34); color:#fff; border-color:rgba(110,200,216,0.5); } .gB { background:rgba(75,165,184,0.14); color:var(--text-primary); } .gC { background:var(--glass); color:var(--text-primary); } .gD { background:rgba(232,196,104,0.14); color:var(--text-primary); border-color:rgba(232,196,104,0.28); } .gF { background:rgba(232,128,107,0.24); color:#fff; border-color:rgba(232,128,107,0.5); }

/* glossary */
.gloss dt { font-size:12.5px; font-weight:600; color:var(--accent-bright); margin-top:14px; } .gloss dd { font-size:12.5px; color:var(--text-secondary); line-height:1.65; margin-top:3px; }
ul.plain { list-style:none; } ul.plain li { font-size:12.5px; color:var(--text-secondary); line-height:1.7; padding:3px 0 3px 16px; position:relative; } ul.plain li::before { content:""; position:absolute; left:0; top:12px; width:6px; height:1px; background:var(--accent); } ul.plain li b { color:var(--text-primary); font-weight:600; }
svg text { font-family:"DM Sans",sans-serif; }
.foot { margin-top:60px; padding-top:18px; border-top:1px solid var(--glass-border); font-size:11px; color:var(--text-muted); line-height:1.7; }

@media (max-width:1100px) { .g5 { grid-template-columns:repeat(3,1fr); } .g4 { grid-template-columns:repeat(2,1fr); } .g3 { grid-template-columns:repeat(2,1fr); } }
@media (max-width:900px) { .two-col { grid-template-columns:1fr; } .hero { flex-direction:column; align-items:flex-start; gap:18px; } .headline { font-size:40px; } .header-pills { display:none; } .me-pick { margin-left:auto; } }
@media (max-width:680px) { header { padding:12px 16px; } .tab-bar { padding:0 12px; top:calc(env(safe-area-inset-top,0px) + 60px); } .wrap { padding:32px 16px 80px; } .g2,.g3,.g4,.g5 { grid-template-columns:1fr; } .headline { font-size:34px; } .header-sub { display:none; } .bname { width:54px; } .bval { width:64px; } .tab-btn { padding:12px 12px 10px; } }

.tbl td .btrack { width:100%; min-width:110px; }
.tbl tr.cut td { border-bottom:1px dashed rgba(110,200,216,0.55); }

</style>
</head>
<body>
<div class="safe-top"></div>
<header>
  <div class="header-mark">
    <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <line x1="19" y1="3" x2="19" y2="35" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-linecap="round"></line>
      <line x1="3" y1="19" x2="35" y2="19" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-linecap="round"></line>
      <ellipse cx="19" cy="19" rx="13" ry="7.5" transform="rotate(-35 19 19)" stroke="#4BA5B8" stroke-width="2"></ellipse>
      <line x1="14" y1="19" x2="24" y2="19" transform="rotate(-35 19 19)" stroke="#D970B5" stroke-width="2" stroke-linecap="round"></line>
      <circle cx="19" cy="19" r="2" fill="#D970B5"></circle>
    </svg>
  </div>
  <div class="header-divider"></div>
  <div class="header-wordmark">
    <div class="header-title">League Hub</div>
    <div class="header-sub">Unprofessional Redraft &nbsp;&middot;&nbsp; Never Ending Dynasty</div>
  </div>
  <div class="header-pills">
    <div class="header-pill"><span>6</span>Weeks played</div>
    <div class="header-pill"><span>2</span>Leagues</div>
    <div class="header-pill"><span>8</span>Seasons</div>
  </div>
  <div class="me-pick">Viewing as <select id="me-select" data-act="meselect" aria-label="Who are you?"></select></div>
</header>
<div class="tab-bar" id="tabbar"></div>

  let me = null;
  try { me = localStorage.getItem('lg_me'); } catch (e) {}
  const h = (location.hash || '').replace('#', '');
  if (h) {
    const [o, t] = h.split('.');
    if (OW.includes(o)) me = o;
    if (t && TABS.some(x => x.id === t)) ST.tab = t;
  }
  if (me && OW.includes(me)) ST.me = me;
}
function syncHash() {
  try { history.replaceState(null, '', '#' + (ST.me || '_') + '.' + ST.tab); } catch (e) {}
}
function setMe(o) {
  ST.me = o || null;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}
const RENDER = {};
function fixTypo(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), nodes = [];

}
function renderTab(id) { const el = document.getElementById('tab-' + id); if (el && RENDER[id]) { el.innerHTML = RENDER[id](); fixTypo(el); } }
function renderAll() { TABS.forEach(t => renderTab(t.id)); }

function seg(key, val, items, render) {

function ownerSelect(key, val, render) {

const seasonItems = (withAll = true) => (withAll ? [['ALL', 'All-time']] : []).concat(YRS.map(y => [y, y])).concat([['2026R', '2026 Redraft'], ['2026D', '2026 Dynasty']]);
function howto(html, title) { return `<details class="howto"><summary>${title || 'How to read this'}</summary><div class="hbody">${html}</div></details>`; }
function hero(eyebrow, headline, desc, mag) {

const endSec = '</div>';

/* ===== data helpers ===== */
function agg(key) {
  const keys = key === 'ALL' ? ALLS : [key];
  const r = { n: 0, w: OW.map(() => 0), exp: OW.map(() => 0), relw: OW.map(() => 0), hi: OW.map(() => 0), lo: OW.map(() => 0), belt: OW.map(() => 0), finS: OW.map(() => 0), finN: OW.map(() => 0), pf: OW.map(() => 0) };
  keys.forEach(s => {
    const d = D.SEAS[s]; r.n += d.n;
    OW.forEach((o, i) => { r.w[i] += d.w[i]; r.exp[i] += d.exp[i]; r.relw[i] += d.rel[i] * d.n; r.hi[i] += d.hi[i]; r.lo[i] += d.lo[i]; r.belt[i] += d.belt[i]; r.pf[i] += d.pf[i]; if (d.fin) { r.finS[i] += d.fin[i]; r.finN[i] += 1; } });
  });
  return r;
}
function runs(arr) { const r = []; let cur = null, n = 0; arr.forEach(x => { if (x === cur) n++; else { if (cur) r.push([cur, n]); cur = x; n = 1; } }); if (cur) r.push([cur, n]); return r; }
function beltSeqR() { let s = []; YRS.forEach(y => { s = s.concat(D.Y[y]); }); return s.concat(D.Y['2026R']); }
function holderNow(L) { const a = D.Y[LKEY[L]]; const h = a[a.length - 1]; let n = 0; for (let i = a.length - 1; i >= 0 && a[i] === h; i--) n++; if (L === 'R') { /* carry back across seasons not needed */ } return { o: h, n }; }
function standings(L) {
  const d = D.SEAS[LKEY[L]];
  return OW.map((o, i) => ({ o, i, w: d.w[i], l: d.n - d.w[i], pf: d.pf[i] })).sort((a, b) => b.w - a.w || b.pf - a.pf).map((r, k) => ({ ...r, rank: k + 1 }));
}
function stealMatrix() {
  const M = OW.map(() => OW.map(() => 0));
  Object.values(D.HO).forEach(l => l.forEach(h => { M[ix(h[1])][ix(h[2])] += 1; }));
  return M;
}
function weeksHeld() {
  const R = OW.map(() => 0), Dy = OW.map(() => 0);
  Object.keys(D.Y).forEach(k => D.Y[k].forEach(o => { if (k === '2026D') Dy[ix(o)]++; else R[ix(o)]++; }));
  return { R, D: Dy };
}
function devsFor(keys) {
  const dev = OW.map(() => []);
  keys.forEach(s => { const d = D.SEAS[s]; OW.forEach((o, i) => d.sc[i].forEach((v, w) => dev[i].push(v - d.avg[w]))); });
  return dev;
}

/* ===== click + change delegation ===== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'tab') go(t.dataset.v);
  else if (a === 'setme') { setMe(t.dataset.v); }
  else if (a === 'setme-go') { setMe(t.dataset.v); go('mypage'); }
  else if (a === 'set') { ST[t.dataset.k] = t.dataset.v; renderTab(t.dataset.r); }
  else if (a === 'clearme') { setMe(null); }
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.act === 'setsel') { ST[t.dataset.k] = t.value; renderTab(t.dataset.r); }
  else if (t.dataset.act === 'meselect') { setMe(t.value || null); }
});

/* ===== CHART HELPERS ===== */
function divBar(v, mx, goodPos, txt) {
  const w = Math.min(Math.abs(v) / (mx || 1), 1) * 40, pos = v >= 0, good = goodPos ? pos : !pos;
  const c = good ? GOOD : BAD;
  const near = Math.abs(v) < (mx || 1) * 0.02;
  return `<div class="btrack"><div class="zero"></div><div style="position:absolute;top:4px;height:12px;${pos ? 'left:50%' : 'right:50%'};width:${w}%;background:${c};opacity:.85;border-radius:${pos ? '0 3px 3px 0' : '3px 0 0 3px'};"></div><span style="position:absolute;top:2px;font-size:11px;color:var(--text-secondary);${pos ? `left:calc(50% + ${w + 1}% + 3px)` : `right:calc(50% + ${w + 1}% + 3px)`}">${near ? txt : txt}</span></div>`;
}
function simpleBar(v, mx, color, txt) {
  const w = Math.max(Math.min(v / (mx || 1), 1) * 100, 0.8);
  return `<div class="btrack"><div style="position:absolute;top:4px;height:12px;left:0;width:${w}%;background:${color};opacity:.9;border-radius:0 3px 3px 0;"></div></div><div class="bval">${txt}</div>`;
}
function barRows(items, mx, opts = {}) {
  // items: [{o, v, txt, color}]
  return items.map(it => `<div class="brow"><div class="${nameCls(it.o)}">${E(it.o)}</div>${simpleBar(it.v, mx, it.color || (meOf(it.o) ? MAG : TEAL), it.txt)}</div>`).join('');
}
function divRows(items, mx, goodPos, dp = 1, extra) {
  return items.map(it => `<div class="brow"><div class="${nameCls(it.o)}">${E(it.o)}</div><div style="flex:1;">${divBar(it.v, mx, goodPos, sg(it.v, dp))}</div>${extra ? `<div class="bval">${extra(it)}</div>` : ''}</div>`).join('');
}
function scaleAxis(lo, hi, mid) { return `<div class="axis"><div style="width:64px"></div><div><span>${lo}</span><span>${mid || ''}</span><span>${hi}</span></div><div style="width:78px"></div></div>`; }

/* dumbbell row: values on a 0..1 scale */
function dumbRow(o, a, b, labelHtml, cA, cB, ring) {
  const left = Math.min(a, b) * 100, w = Math.abs(a - b) * 100;
  return `<div class="brow"><div class="${nameCls(o)}">${E(o)}</div><div class="btrack"><div style="position:absolute;left:0;right:0;top:10px;border-top:1px solid rgba(255,255,255,0.08)"></div><div class="line" style="left:${left}%;width:${Math.max(w, .5)}%;background:${cB};opacity:.45"></div><div class="dot hollow" style="left:calc(${a * 100}% - 5px)"></div><div class="dot" style="left:calc(${b * 100}% - 5px);background:${cB}"></div></div><div class="bval" style="width:150px">${labelHtml}</div></div>`;
}

/* generic heat color: value -> background */
function heatBG(v, mx, goodPos) {
  if (Math.abs(v) < mx * 0.04) return ['transparent', 'var(--text-secondary)'];
  const a = Math.min(Math.abs(v) / mx, 1), good = goodPos ? v > 0 : v < 0;
  const rgb = good ? '110,200,216' : '232,128,107';
  return [`rgba(${rgb},${0.14 + 0.62 * a})`, a > 0.6 ? '#fff' : 'var(--text-primary)'];
}

/* bump / line chart with ranks (y reversed) */
function bumpSVG(labels, series, hl, opts = {}) {
  const W = 760, Hh = 360, ml = 36, mr = 86, mt = 14, mb = 28, n = labels.length, maxR = 10;
  const x = i => ml + (n === 1 ? 0 : i * (W - ml - mr) / (n - 1));
  const y = r => mt + (r - 1) * (Hh - mt - mb) / (maxR - 1);
  let g = '';
  for (let r = 1; r <= maxR; r++) g += `<line x1="${ml}" x2="${W - mr}" y1="${y(r)}" y2="${y(r)}" stroke="rgba(255,255,255,0.06)"/><text x="${ml - 8}" y="${y(r) + 4}" text-anchor="end" font-size="10" fill="rgba(255,255,255,0.4)">${r}</text>`;
  const step = Math.ceil(n / 14);
  labels.forEach((l, i) => { if (i % step === 0 || i === n - 1) g += `<text x="${x(i)}" y="${Hh - 8}" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)">${l}</text>`; });
  const order = OW.map((o, i) => i).sort((a, b) => (OW[a] === hl) - (OW[b] === hl));
  order.forEach(i => {
    const o = OW[i], isH = o === hl, pts = [];
    series[i].forEach((r, k) => { if (r != null) pts.push([x(k), y(r)]); });
    if (!pts.length) return;
    const d = pts.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const col = isH ? MAG : 'rgba(110,200,216,0.30)';
    g += `<path d="${d}" fill="none" stroke="${col}" stroke-width="${isH ? 3.4 : 1.5}" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = pts[pts.length - 1];
    if (isH) pts.forEach(p => g += `<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="${MAG}"/>`);
    g += `<text x="${last[0] + 8}" y="${last[1] + 4}" font-size="${isH ? 12 : 10.5}" font-weight="${isH ? 700 : 500}" fill="${isH ? MAG : 'rgba(255,255,255,0.55)'}">${E(o)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="${E(opts.aria || 'Rank over time')}">${g}</svg>`;
}

/* scatter: points {x,y,o,s,rec}; y is win pct 0..1 */
function scatterSVG(pts, hl, labelSet, xmin, xmax) {
  const W = 760, Hh = 400, ml = 48, mr = 24, mt = 14, mb = 42;
  const X = v => ml + (v - xmin) / (xmax - xmin) * (W - ml - mr), Y = v => mt + (1 - v) * (Hh - mt - mb);
  let sxy = 0, sxx = 0; pts.forEach(p => { sxy += p.x * (p.y - 0.5); sxx += p.x * p.x; });
  const slope = sxy / (sxx || 1);
  let g = '';
  for (let v = 0; v <= 1.001; v += 0.25) g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,0.07)"/><text x="${ml - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="10" fill="rgba(255,255,255,0.4)">${Math.round(v * 100)}%</text>`;
  const t0 = Math.ceil(xmin / 10) * 10; for (let v = t0; v <= xmax; v += 10) g += `<line x1="${X(v)}" x2="${X(v)}" y1="${mt}" y2="${Hh - mb}" stroke="rgba(255,255,255,${v === 0 ? 0.16 : 0.05})"/><text x="${X(v)}" y="${Hh - mb + 16}" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)">${v > 0 ? '+' + v : v}</text>`;
  g += `<text x="${(ml + W - mr) / 2}" y="${Hh - 6}" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.5)">Points per game vs. league average</text>`;
  g += `<line x1="${X(xmin)}" y1="${Y(0.5 + slope * xmin)}" x2="${X(xmax)}" y2="${Y(0.5 + slope * xmax)}" stroke="rgba(255,255,255,0.4)" stroke-dasharray="6 5" stroke-width="1.5"/>`;
  const base = pts.filter(p => p.o !== hl), mine = pts.filter(p => p.o === hl);
  base.forEach(p => g += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="rgba(110,200,216,0.7)" stroke="#0D1B22" stroke-width="1"><title>${E(p.o)} ${p.s}: ${p.rec}, ${sg(p.x)} pts/game vs avg</title></circle>`);
  mine.forEach(p => g += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="6.5" fill="${MAG}" stroke="#0D1B22" stroke-width="1.5"><title>${E(p.o)} ${p.s}: ${p.rec}, ${sg(p.x)} pts/game vs avg</title></circle>`);
  pts.forEach((p, i) => { if (labelSet.has(i)) { const left = X(p.x) > W - mr - 90; g += `<text x="${X(p.x) + (left ? -9 : 9)}" y="${Y(p.y) - 7}" text-anchor="${left ? 'end' : 'start'}" font-size="10.5" fill="${p.o === hl ? MAG : 'rgba(255,255,255,0.75)'}" font-weight="${p.o === hl ? 700 : 500}">${E(p.label)}</text>`; } });
  let mx = 0, my = 0; pts.forEach(p => { mx += p.x; my += p.y; }); mx /= pts.length; my /= pts.length;
  let a = 0, b = 0, c = 0; pts.forEach(p => { a += (p.x - mx) * (p.y - my); b += (p.x - mx) ** 2; c += (p.y - my) ** 2; });
  return { svg: `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Scatter of scoring versus win percentage">${g}</svg>`, r: a / Math.sqrt(b * c), slope };
}

/* strip rows: items [{o, devs[]}] */
function stripRows(items, lo, hi) {
  const sc = v => ((Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo)) * 100;
  const rows = items.map(it => { const m = mean(it.devs), s = sdev(it.devs); return { ...it, m, s }; }).sort((a, b) => b.m - a.m);
  let h = '';
  rows.forEach(r => {
    const me = meOf(r.o);
    h += `<div class="brow"><div class="${nameCls(r.o)}">${E(r.o)}</div><div class="btrack" style="height:22px;border-bottom:1px solid rgba(255,255,255,0.07)"><div style="position:absolute;left:${sc(0)}%;top:0;bottom:0;border-left:1px dashed rgba(255,255,255,0.2)"></div><div style="position:absolute;left:${sc(r.m)}%;top:2px;height:18px;border-left:2px solid rgba(255,255,255,0.85)"></div>${r.devs.map(v => `<div style="position:absolute;left:calc(${sc(v)}% - 3px);top:8px;width:6px;height:6px;border-radius:50%;background:${me ? MAG : TEALB};opacity:${me ? .75 : .5}"></div>`).join('')}</div><div class="bval" style="width:96px">${sg(r.m)} \u00b1${r.s.toFixed(0)}</div></div>`;
  });
  h += `<div class="axis"><div style="width:64px"></div><div><span>${lo}</span><span>0 = league average that week</span><span>+${hi}</span></div><div style="width:96px"></div></div>`;
  return h;
}

/* final-rank mini line (single owner) */
function miniLine(vals, labels, maxR) {
  const W = 520, Hh = 150, ml = 30, mr = 14, mt = 10, mb = 24, n = vals.length;
  const x = i => ml + i * (W - ml - mr) / (n - 1), y = r => mt + (r - 1) * (Hh - mt - mb) / (maxR - 1);
  let g = '';
  [1, 3, 5, 7, 10].forEach(r => g += `<line x1="${ml}" x2="${W - mr}" y1="${y(r)}" y2="${y(r)}" stroke="rgba(255,255,255,0.07)"/><text x="${ml - 7}" y="${y(r) + 4}" text-anchor="end" font-size="10" fill="rgba(255,255,255,0.4)">${r}</text>`);
  g += `<line x1="${ml}" x2="${W - mr}" y1="${y(6.5)}" y2="${y(6.5)}" stroke="rgba(110,200,216,0.45)" stroke-dasharray="4 4"/><text x="${W - mr}" y="${y(6.5) - 4}" text-anchor="end" font-size="9" fill="rgba(110,200,216,0.7)">playoff line</text>`;
  const d = vals.map((v, i) => (i ? 'L' : 'M') + x(i) + ' ' + y(v)).join(' ');
  g += `<path d="${d}" fill="none" stroke="${MAG}" stroke-width="2.6" stroke-linejoin="round"/>`;
  vals.forEach((v, i) => { g += `<circle cx="${x(i)}" cy="${y(v)}" r="${v === 1 ? 6 : 4.2}" fill="${v === 1 ? GOLD : MAG}" stroke="#0D1B22" stroke-width="1.5"/><text x="${x(i)}" y="${Hh - 6}" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.45)">${labels[i]}</text>`; });
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Final finish by season">${g}</svg>`;
}

/* grade tiles */
function gradeTiles(gr) {
  const L = { scoring: 'Scoring', winning: 'Winning', luck: 'Luck', consistency: 'Consistency', playoffs: 'Playoffs', clutch: 'Clutch', belt: 'Belt' };
  return `<div class="grades">${Object.keys(L).map(k => `<div class="grade g${gr[k][0]}"><div class="gl">${L[k]}</div><div class="gv">${gr[k][0]}</div><div class="gr">${ord(gr[k][1])} of 10</div></div>`).join('')}</div>`;

/* barcode */
function barcodeRows(rowKeys, cols) {
  const labels = k => k === '2026R' ? '2026 Red' : k === '2026D' ? '2026 Dyn' : k;
  let h = `<div class="hgrid" style="grid-template-columns:64px repeat(${cols},minmax(0,1fr));gap:2px"><div></div>`;
  for (let w = 1; w <= cols; w++) h += `<div class="hhead">${(w === 1 || w % 5 === 0 || w === cols) ? w : ''}</div>`;
  rowKeys.forEach(k => {
    const arr = D.Y[k], is26 = k.startsWith('2026');
    h += `<div class="hlab" style="font-size:11.5px;${is26 ? 'font-weight:600' : 'color:var(--text-secondary)'}">${labels(k)}</div>`;
    for (let i = 0; i < cols; i++) {
      const o = arr[i];
      if (o === undefined) { h += is26 ? `<div style="height:26px;border-radius:4px;border:1px dashed rgba(255,255,255,0.16)"></div>` : `<div style="height:26px;border-radius:4px;background:rgba(255,255,255,0.04)"></div>`; continue; }
      const chg = i === 0 || arr[i - 1] !== o, ring = is26 && i === arr.length - 1;
      h += `<div title="${E(o)}, ${labels(k)} week ${i + 1}" style="height:26px;border-radius:4px;background:${OCOL[o]};color:${OTXT[o]};font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;overflow:hidden;${chg ? 'border-left:3px solid #fff;' : ''}${ring ? 'box-shadow:0 0 0 2px #fff;' : ''}">${chg ? AB(o) : ''}</div>`;
    }
  });
  return h + '</div>';
}
function ownerLegend() { return `<div class="legend">${OW.map(o => `<span><i class="sw" style="background:${OCOL[o]}"></i>${meOf(o) ? `<b style="color:${MAG}">${o}</b>` : o}</span>`).join('')}</div>`; }

/* ===== SHARED: report card ===== */

function highlightList(o) {

function reportCard(o) {

  order.forEach(i => { g += `<div class="hlab${meOf(OW[i]) ? ' me' : ''}">${OW[i]}</div>`; order.forEach(j => { if (i === j) { g += `<div class="hcell" style="background:rgba(255,255,255,0.03)"></div>`; return; } const w = M[i][j][0], l = M[i][j][1]; if (w + l === 0) { g += `<div class="hcell" style="border:1px dashed rgba(255,255,255,0.12)"></div>`; return; } const p = w / (w + l), dev = Math.abs(p - 0.5) * 2; const bg = p > 0.5 ? `rgba(110,200,216,${0.14 + 0.62 * dev})` : p < 0.5 ? `rgba(232,128,107,${0.14 + 0.62 * dev})` : 'transparent'; g += `<div class="hcell" title="${OW[i]} vs ${OW[j]}: ${w}-${l}" style="background:${bg};color:${dev > 0.6 ? '#fff' : 'var(--text-primary)'}">${w}-${l}</div>`; }); });

/* ===== ROOTING GUIDE ===== */
const RMETRIC = { p: 'playoff odds', t: 'title odds' };
function rootFx(L, gi, owner, metric) {
  const g = D.ROOT[L].games[gi], e = g.eff[owner], base = D.ROOT[L].base[owner];
  let m = metric === 'auto' ? ((base[0] >= 0.97 || base[0] <= 0.01) ? 't' : 'p') : metric;
  const A = m === 'p' ? e[0] : e[2], B = m === 'p' ? e[1] : e[3];
  const diff = (A - B) * 100, own = owner === g.a || owner === g.b;
  const thr = m === 'p' ? 0.6 : 0.3;
  return { gi, g, m, A, B, diff, own, root: own ? owner : (diff >= 0 ? g.a : g.b), gain: Math.abs(diff), neutral: !own && Math.abs(diff) < thr };
}
function rootList(L, owner, metric) {
  return D.ROOT[L].games.map((g, gi) => rootFx(L, gi, owner, metric)).sort((a, b) => b.gain - a.gain);
}
function pctPts(v) { return (v < 10 ? v.toFixed(1) : Math.round(v)) + ' pts'; }
function oddsTxt(v, m) { const x = v * 100; return (m === 't' && x < 10 ? x.toFixed(1) : Math.round(x)) + '%'; }
function rootCard(L, owner, metric) {
  const rows = rootList(L, owner, metric), base = D.ROOT[L].base[owner];

    const g = r.g, opp = g.a === owner ? g.b : g.a;
    const title = r.own ? `Your game vs ${opp}` : `${g.a} vs ${g.b}`;
    const verdict = r.own ? `Win your game` : r.neutral ? `Doesn\u2019t matter` : `Root for <b style="color:${meOf(r.root) ? MAG : TEALB}">${r.root}</b>`;
    const A = oddsTxt(r.A, r.m), B = oddsTxt(r.B, r.m);
    const detail = r.own ? `Your ${RMETRIC[r.m]}: ${oddsTxt(owner === g.a ? r.A : r.B, r.m)} with a win, ${oddsTxt(owner === g.a ? r.B : r.A, r.m)} with a loss.` : `Your ${RMETRIC[r.m]}: ${A} if ${g.a} wins, ${B} if ${g.b} wins.`;
    return `<div style="display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--glass-border)">
      <div><div style="font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700">${E(title)}</div><div style="font-size:14px;margin:3px 0 2px;font-weight:600">${verdict}</div><div style="font-size:11.5px;color:var(--text-secondary)">${detail}</div></div>
      <div>${r.neutral ? `<div style="font-size:11px;color:var(--text-muted);text-align:right">&lt; ${r.m === 'p' ? '0.6' : '0.3'} pts</div>` : `<div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:10px;background:rgba(255,255,255,0.07);border-radius:5px;overflow:hidden"><div style="height:100%;width:${Math.min(r.gain / 30, 1) * 100}%;background:${r.own ? GOLD : (meOf(owner) ? MAG : TEAL)};border-radius:5px"></div></div><span style="width:52px;text-align:right;font-size:12px;font-weight:700;color:var(--text-primary)">+${pctPts(r.gain)}</span></div>`}</div></div>`;
  }).join('');
  const m = rows[0].m;
  return `<div class="card" style="padding:18px 20px 8px"><div class="card-num">${LNAME[L]}</div><div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">${owner}\u2019s odds today: <b style="color:var(--text-primary)">${pc(base[0])}</b> playoffs &nbsp;&middot;&nbsp; <b style="color:var(--text-primary)">${(base[1] * 100).toFixed(1)}%</b> title${m === 't' ? ' &nbsp;&middot;&nbsp; <span class="badge b-teal">scored on title odds</span>' : ''}</div>${items}</div>`;
}

}
function rootMine(me) {

function sosHeat(metric) {

  const order = OW.map((o, i) => i).sort((a, b) => metric === 'sch' ? tot(b) - tot(a) : tot(a) - tot(b));
  let h = `<div class="hgrid" style="grid-template-columns:64px repeat(7,minmax(0,1fr)) 56px"><div></div>${YRS.map(y => `<div class="hhead">${y}</div>`).join('')}<div class="hhead">${metric === 'sch' ? 'Total' : 'Average'}</div>`;
  order.forEach(i => {
    h += `<div class="hlab${meOf(OW[i]) ? ' me' : ''}">${OW[i]}</div>`;
    YRS.forEach(y => { const v = D.SOS[y][metric][i], c = heatBG(v, mx, metric === 'sch'); h += `<div class="hcell" title="${OW[i]} ${y}: ${sg(v)}" style="background:${c[0]};color:${c[1]}">${sg(v)}</div>`; });
    const t = tot(i), c = heatBG(t, metric === 'sch' ? 8 : 2, metric === 'sch'); h += `<div class="hcell" style="background:${c[0]};color:${c[1]};font-weight:700">${sg(t)}</div>`;
  });
  return h + '</div>';
}
function sosBars(metric, view) {

  else if (view.startsWith('R')) { const k = view.slice(1); vals = OW.map((o, i) => metric === 'sch' ? D.REM[k].edge[i] : D.REM[k].opp[i]); cap = (k === '2026R' ? 'Redraft' : 'Dynasty') + ', Weeks 7-14 still to play.'; }
  else { vals = OW.map((o, i) => D.SOS[view][metric][i]); cap = slab(view) + (view.startsWith('2026') ? ' (six games so far).' : '.'); }
  const mx = Math.max(...vals.map(Math.abs), 0.01), dp = view.startsWith('R') ? 2 : 1;
  const order = OW.map((o, i) => i).sort((a, b) => metric === 'sch' ? vals[b] - vals[a] : vals[a] - vals[b]);
  return { cap, html: order.map(i => `<div class="brow"><div class="${nameCls(OW[i])}">${OW[i]}</div><div style="flex:1">${divBar(vals[i], mx, metric === 'sch', sg(vals[i], dp))}</div></div>`).join('') };
}
const CAL = [[0.04, 0.00, 8], [0.22, 0.31, 13], [0.43, 0.00, 5], [0.62, 0.73, 11], [0.80, 0.85, 13], [0.97, 0.95, 20]];
RENDER.luck = () => {
  const sel = ST.luckSeason, keys = sel === 'ALL' ? YRS : [sel];
  // luck bars
  const lk = OW.map((o, i) => ({ o, v: sum(keys.map(k => D.SEAS[k].w[i] - D.SEAS[k].exp[i])) })).sort((a, b) => b.v - a.v);
  const mL = Math.max(...lk.map(x => Math.abs(x.v)), 1);
  const top = lk[0], bot = lk[lk.length - 1];
  // scatter
  const pts = []; keys.forEach(k => { const d = D.SEAS[k]; OW.forEach((o, i) => pts.push({ x: d.rel[i], y: d.w[i] / d.n, o, s: k, rec: d.w[i] + '-' + (d.n - d.w[i]), label: sel === 'ALL' ? o + " '" + k.slice(2) : o })); });
  const hl = ST.hlOwner || ST.me || OW[0];
  let sxy = 0, sxx = 0; pts.forEach(p => { sxy += p.x * (p.y - 0.5); sxx += p.x * p.x; }); const slope = sxy / sxx;
  const res = pts.map(p => p.y - (0.5 + slope * p.x)), idx = res.map((r, i) => i).sort((a, b) => res[b] - res[a]);
  const lab = new Set(); if (sel === 'ALL') { idx.slice(0, 3).forEach(i => lab.add(i)); idx.slice(-3).forEach(i => lab.add(i)); pts.forEach((p, i) => { if (p.o === hl && Math.abs(res[i]) > 0.15) lab.add(i); }); } else pts.forEach((p, i) => lab.add(i));
  const xs = pts.map(p => p.x), xmin = Math.floor(Math.min(...xs) / 10) * 10 - 5, xmax = Math.ceil(Math.max(...xs) / 10) * 10 + 5;
  const sc = scatterSVG(pts, hl, lab, xmin, xmax);
  const devs = devsFor(sel === 'ALL' ? YRS : keys);
  const sos = sosBars(ST.sosMetric, ST.sosView);
  const views = [['ALL', 'All 7 seasons']].concat(YRS.map(y => [y, y])).concat([['2026R', '2026 Redraft'], ['2026D', '2026 Dynasty'], ['R2026R', 'Redraft rest of 2026'], ['R2026D', 'Dynasty rest of 2026']]);
  return `<div class="wrap">${hero('Luck & Skill', 'How much is<br><em>luck?</em>', 'Scoring wins games, but who you happen to play and when they have a big week matters too. These views separate the two.')}
    ${pills('Season', 'luckSeason', sel, seasonItems(true), 'luck')}
    <div class="note" style="margin:-6px 0 12px">All-time on this page means the seven completed Redraft seasons (2019-2025).</div>
    ${secHead('Who got <em>lucky</em>', '')}
      <div class="takeaway">${sel === 'ALL' ? `<b>${top.o}</b> has won ${sg(top.v)} games more than his scoring predicts over seven seasons, the luckiest in the league. <b>${bot.o}</b> is at ${sg(bot.v)}.` : `In ${slab(sel)}, <b>${top.o}</b> was the luckiest (${sg(top.v)} wins) and <b>${bot.o}</b> the unluckiest (${sg(bot.v)}).`}</div>
      <div class="card">${divRows(lk, mL, true, 1)}<div class="axis"><div style="width:64px"></div><div><span>unlucky</span><span>0</span><span>lucky</span></div><div style="width:78px"></div></div></div>
      ${howto('<p><b>Luck</b> = actual wins minus <b>expected wins</b>. Expected wins imagine you played every other owner every week: if you outscored 6 of 9 teams one week, you earn 0.67 expected wins. Beating that total means your schedule gave you easier opponents on the nights it mattered. Teal bars are lucky seasons, orange are unlucky, and the number is wins.</p><p>This is the same number as <b>schedule luck</b> in the section below.</p>')}
    ${endSec}
    ${secHead('Scoring vs. <em>winning</em>', 'Each dot is one team-season.')}
      <div class="filters"><span class="f-label">Highlight</span>${ownerSelect('hlOwner', hl, 'luck')}</div>
      <div class="takeaway">Scoring explains most of winning: the correlation is <b>${sc.r.toFixed(2)}</b> in this view. Dots well above the dashed line won more than their points deserved; dots below won less.</div>
      <div class="card" style="padding:14px 16px">${sc.svg}</div>
      ${howto('<p>Across: how many points per game a team scored above or below that season\u2019s league average. Up: its win percentage. The dashed line is the typical win rate for that much scoring. A dot above the line is lucky, below is unlucky. The pink dots are the owner you highlight. The correlation runs from 0 (no link) to 1 (perfect).</p>')}
    ${endSec}
    ${secHead('Boom or <em>bust</em>', 'How steady each owner\u2019s weekly scoring is.')}
      <div class="card">${stripRows(OW.map(o => ({ o, devs: devs[ix(o)] })), -85, 85)}</div>
      ${howto('<p>Each dot is one week: points scored minus that week\u2019s league average. The white tick is the owner\u2019s average and the \u00b1 number is the typical swing. A long spread of dots means boom-or-bust; a tight cluster means steady. Owners are sorted from best average to worst.</p>')}
    ${endSec}
    ${secHead('Strength of <em>schedule</em>', 'Two ways to measure who had the harder road.')}
      ${seg('sosMetric', ST.sosMetric, [['sch', 'Schedule luck (wins)'], ['opp', 'Opponent strength (points/game)']], 'luck')}
      <div class="takeaway">${ST.sosMetric === 'sch' ? '<b>Schedule luck</b> is the real separator: Dylan has been lucky every season (+10.3 wins in total) while Hoover has been the most unlucky (-4.3).' : '<b>Opponent strength</b> barely differs because everyone plays nearly the same opponents. The luck of <i>when</i> they score is what separates schedules.'}</div>
      <div class="card"><div class="hgrid-wrap">${sosHeat(ST.sosMetric)}</div></div>
      ${howto(ST.sosMetric === 'sch' ? '<p>Each cell is a season. <b>Schedule luck</b> is actual wins minus the wins you would expect against an average schedule given your weekly scores. Teal is a lucky schedule, orange is unlucky, and the last column adds up all seven seasons.</p>' : '<p>Each cell is your opponents\u2019 average points per game that season minus the league average. Orange is a tougher group of opponents, teal an easier one; the last column is the seven-season average. The numbers stay small in a 10-team round robin.</p>')}
      ${seg('sosView', ST.sosView, views, 'luck')}
      <div class="note" style="margin:-6px 0 10px">${sos.cap}</div>
      <div class="card">${sos.html}</div>
    ${endSec}
    ${secHead('Does scoring <em>carry over</em>?', '')}
      <div class="tiles"><div class="tile teal"><div class="v">-0.02</div><div class="l">Year-to-year scoring correlation</div><div class="s">essentially zero</div></div><div class="tile"><div class="v">0.35</div><div class="l">First 6 weeks vs. rest of season</div><div class="s">moderate</div></div><div class="tile"><div class="v">0.84</div><div class="l">Scoring vs. wins, 2019-2023</div><div class="s">strong</div></div></div>
      <div class="callout" style="margin-top:12px">Being a top scorer one year says almost nothing about the next: <b>the correlation between one season\u2019s scoring and the following season\u2019s is about zero</b>. Within a season, the first six weeks do carry some signal. That is why last year\u2019s results do not feed the odds on this site, and why a hot or cold start should be trusted only a little.</div>
      ${howto('<p>Correlation runs from -1 to 1; 0 means no relationship. The first tile compares each owner\u2019s scoring relative to the league in one season against the next (60 owner-seasons). The second compares the first six weeks of a season with the remaining weeks. The third links scoring and win percentage across 50 team-seasons.</p>')}
    ${endSec}
    ${secHead('How good are the <em>odds</em>?', 'The playoff-odds method re-run at Week 6 of all seven past seasons (70 team-seasons).')}
      <div class="card">${CAL.map(r => `<div class="brow"><div class="bname" style="width:110px;font-weight:400;color:var(--text-secondary)">Predicted ~${Math.round(r[0] * 100)}%</div><div class="btrack"><div style="position:absolute;left:0;right:0;top:10px;border-top:1px solid rgba(255,255,255,0.08)"></div><div class="line" style="left:${Math.min(r[0], r[1]) * 100}%;width:${Math.max(Math.abs(r[0] - r[1]) * 100, .5)}%;background:#9aa9b0;opacity:.35"></div><div class="dot hollow" style="left:calc(${r[0] * 100}% - 5px)"></div><div class="dot" style="left:calc(${r[1] * 100}% - 5px);background:${MAG}"></div></div><div class="bval" style="width:140px">actual ${Math.round(r[1] * 100)}% (n=${r[2]})</div></div>`).join('')}<div class="axis"><div style="width:110px"></div><div><span>0%</span><span>50%</span><span>100%</span></div><div style="width:140px"></div></div><div class="note">Average error (Brier score) 0.129, against 0.240 for guessing 60% for everyone. Teams given 50% or better made the playoffs 86% of the time.</div></div>
      ${howto('<p>Each row groups team-seasons by the playoff chance the method gave them at Week 6. The hollow dot is the average prediction and the pink dot is how often those teams really made the playoffs. If the dots sit close together the odds are honest. Small groups (n) wobble, which is why the 40% row looks off.</p>')}
    ${endSec}
  </div>`;
};

/* ===== REPORT CARDS ===== */
RENDER.cards = () => {
  const o = ST.cardOwner && OW.includes(ST.cardOwner) ? ST.cardOwner : (ST.me || OW[0]);
  const L = { scoring: 'Scoring', winning: 'Winning', luck: 'Luck', consistency: 'Consistency', playoffs: 'Playoffs', clutch: 'Clutch', belt: 'Belt' };
  const mat = `<div class="card"><div class="scroll-x"><table class="tbl"><thead><tr><th>Owner</th>${Object.values(L).map(l => `<th class="c">${l}</th>`).join('')}</tr></thead><tbody>${OW.map(x => `<tr class="${meOf(x) ? 'me' : ''}" data-act="set" data-k="cardOwner" data-v="${x}" data-r="cards" style="cursor:pointer"><td class="n">${x}</td>${Object.keys(L).map(k => { const g = D.CARDS[x].grades[k]; return `<td class="c"><span class="grade g${g[0]}" style="display:inline-block;padding:2px 10px;border-radius:6px;font-weight:700;font-size:12px">${g[0]}</span></td>`; }).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  return `<div class="wrap">${hero('Report cards', 'Everyone,<br><em>graded.</em>', 'Seven grades per owner against the other nine, plus season history and highlights. Tap anyone in the table to open their card.')}
    <div class="filters"><span class="f-label">Open card</span>${ownerSelect('cardOwner', o, 'cards')}</div>
    ${reportCard(o)}
    ${howto('<p>Grades rank each owner against the other nine owners in the Redraft league, 2019-2025: <b>A</b> = top two, <b>B</b> = 3rd-4th, <b>C</b> = 5th-6th, <b>D</b> = 7th-8th, <b>F</b> = bottom two.</p><p><b>Scoring</b>: points per game vs the league average. <b>Winning</b>: win percentage. <b>Luck</b>: wins above expected. <b>Consistency</b>: how steady weekly scores are (a high grade is steady). <b>Playoffs</b>: average finish. <b>Clutch</b>: playoff scoring vs the same owner\u2019s regular season. <b>Belt</b>: total weeks holding the McGuffin, both leagues.</p>')}
    ${secHead('All the grades, <em>at a glance</em>', '')}${mat}${endSec}
  </div>`;
};

/* ===== HOW TO READ ===== */
RENDER.guide = () => {
  const G = [
    ['Expected wins', 'The wins you would collect if you played every other owner every week. Beat 6 of 9 teams\u2019 scores in a week and you earn 0.67 expected wins. It measures how good your scoring was, ignoring who you actually faced.'],
    ['Luck / schedule luck', 'Actual wins minus expected wins. Positive means your schedule gave you easier opponents when it counted; negative means opponents had their big weeks against you.'],
    ['Points vs. average', 'Your points per game minus the league average points per game that season. It lets you compare scoring across years, since scoring levels change.'],
    ['Opponent strength', 'The average points per game of the owners you played, minus the league average. Positive means a tougher slate.'],
    ['Playoff odds', 'The share of 200,000 simulated seasons where the owner finishes in the top 6 of 10. Title odds is the share where they win the bracket.'],
    ['Magic number', 'The total wins that give a set chance at the playoffs. The page shows the totals for about 50%, about 90%, and a guaranteed spot.'],
    ['Swing', 'How much one result moves playoff odds: odds after a win minus odds after a loss.'],
    ['McGuffin / belt', 'A traveling title. It changes hands whenever the holder loses a game, and whoever holds it when the season ends is that year\u2019s belt champion.'],
    ['Reign and handoff', 'A reign is one unbroken stretch of holding the belt. A handoff is the game that ended it.'],
    ['Boom or bust', 'How widely a team\u2019s weekly scores swing around its average. A wide spread is boom-or-bust; a tight spread is steady.'],
    ['Clutch', 'Playoff scoring per game minus the same owner\u2019s regular-season average that year. Positive means they score more when it counts.'],
    ['Median game (2024-25)', 'In those two seasons every team also earned a win for finishing in the top half of weekly scores, which is why records were out of 28 games. On this site luck and head-to-head records use only the 14 real matchups.'],
    ['Rooting interest', 'Which team you want to win a game you are not in, because it leaves your playoff (or title) odds higher. The number is the percentage-point swing between the two results.'],
    ['Seed', 'A playoff slot set by regular-season record, then points scored. The top two of six seeds get a first-round bye.']
  ];
  const how = [
    ['Home', 'Pick your name and see the six things worth knowing this week.'],
    ['My Page', 'Your grades, 2026 odds and wins needed, this week\u2019s key game, season history, rivals and belt history.'],
    ['2026 Now', 'The live race in either league: odds, magic numbers, Week 7 stakes, standings flow and schedule.'],
    ['Rooting Guide', 'For every Week 7 game, who each owner should want to win and how much it is worth, plus who is pulling for whom.'],
    ['The McGuffin', 'The belt barcode, every handoff, weeks held and the steal map.'],
    ['History', 'Scoreboard, head-to-head, flow, finishes, playoffs and records for any season or all-time.'],
    ['Luck & Skill', 'Luck, scoring vs. winning, boom-or-bust, schedule strength, and how reliable the odds are.'],
    ['Report Cards', 'Seven letter grades per owner plus a full season-by-season table.']
  ];
  const assume = [
    '<b>Two leagues.</b> History is the Unprofessional Redraft league (2019-2025). Never Ending Dynasty started in 2026 and has a higher-scoring format, so the two are measured separately.',
    '<b>The belt.</b> Zach is assumed to have held it entering 2026 in both leagues (counted as one week held in Dynasty). Belt weeks include weeks after the last game of a season, which go to the holder.',
    '<b>Odds are estimates.</b> They simulate the remaining schedule from scores so far. They ignore injuries, trades, byes and lineup changes. Redraft and Dynasty odds are as of Week 6.',
    '<b>Scoring that does not carry over.</b> Scoring in one season says very little about the next (correlation about zero), so history is not used in the odds.',
    '<b>Names.</b> Hoover is the owner formerly listed as Kaleb. In the Sleeper leagues Isaac appears as ormi and Ben as bkelton.',
    '<b>Small samples.</b> Six games per owner in 2026 and 2 to 4 playoff games per owner per year mean the biggest swings are often just noise.',
    '<b>Two-week rounds.</b> A few playoff and consolation rounds were scored over two weeks; those combined totals are excluded from the single-week record book.'
  ];
  return `<div class="wrap">${hero('How to read this', 'The fine<br><em>print.</em>', 'Plain-English definitions, how each page works, and the assumptions behind the numbers.')}
    <div class="two-col"><div class="card"><div class="eyebrow">Glossary</div><dl class="gloss">${G.map(g => `<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join('')}</dl></div>
    <div><div class="card"><div class="eyebrow">What each page is for</div><ul class="plain">${how.map(h => `<li><b>${h[0]}.</b> ${h[1]}</li>`).join('')}</ul></div>
    <div class="card" style="margin-top:14px"><div class="eyebrow mag">Colors</div><ul class="plain"><li><b style="color:${MAG}">Pink</b> always means you (the owner you picked at the top).</li><li><b style="color:${TEALB}">Teal</b> is good news or the neutral color; <b style="color:${BAD}">orange</b> is bad news or a harder road.</li><li><b style="color:${GOLD}">Gold</b> marks champions and belt holders.</li></ul></div></div></div>
    ${secHead('Assumptions & <em>limits</em>', '')}<div class="card"><ul class="plain">${assume.map(a => `<li>${a}</li>`).join('')}</ul></div>${endSec}
    <div class="foot">Built from game-by-game scores for every week from 2019 through Week 6 of 2026. Numbers refresh each week when new results are added.</div></div>`;
};

/* ===== BOOT ===== */
(function boot() {

  document.getElementById('panels').innerHTML = TABS.map(t => `<div class="tab-panel${t.id === ST.tab ? ' active' : ''}" id="tab-${t.id}"></div>`).join('');

})();
